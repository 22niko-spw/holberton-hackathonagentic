<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Bras</title>
  <link rel="icon" type="image/png" href="/static/assets/favicon.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // Applique le thème choisi avant le premier rendu, pour éviter un
    // flash du mauvais thème. localStorage seul (pas de cookie/serveur) :
    // le choix est local au navigateur.
    (function () {
      var saved = localStorage.getItem("le-bras:theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img src="/static/assets/logo.png" alt="Le Bras" class="sidebar__logo" />
        <div>
          <h1>Le Bras</h1>
          <p class="sidebar__tagline">Agent RH à validation humaine</p>
        </div>
      </div>

      <button type="button" id="new-chat" class="sidebar__new-chat">
        + Nouvelle conversation
      </button>

      <div class="sidebar__section">
        <h2 class="sidebar__heading">Équipe</h2>
        <div id="team" class="team">
          <div class="skeleton skeleton--row"></div>
          <div class="skeleton skeleton--row"></div>
          <div class="skeleton skeleton--row"></div>
        </div>
      </div>

      <div class="sidebar__section sidebar__section--pinned">
        <div class="sidebar__footer">
          <button
            type="button"
            id="theme-toggle"
            class="sidebar__gear"
            aria-label="Basculer entre thème clair et sombre"
            title="Thème clair / sombre"
          >
            <!-- hidden/visible piloté en JS via style.display, pas l'attribut
                 HTML "hidden" (peu fiable sur <svg>, namespace différent) -->
            <svg id="theme-icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true" style="display: none">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <svg id="theme-icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
              <path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a6.7 6.7 0 0 0 11.2 11.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="tools-popover">
            <button
              type="button"
              id="tools-settings-toggle"
              class="sidebar__gear"
              aria-expanded="false"
              aria-label="Outils de l'agent"
              title="Outils de l'agent"
            >
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
            <div id="tools-panel-wrap" class="tools-panel-wrap" hidden>
              <h3 class="tools-panel__title">Outils de l'agent</h3>
              <div id="tools-panel" class="tools-panel">
                <div class="skeleton skeleton--row"></div>
                <div class="skeleton skeleton--row"></div>
                <div class="skeleton skeleton--row"></div>
              </div>

              <h3 class="tools-panel__title tools-panel__title--settings">Réglages</h3>
              <label class="toggle">
                <span class="toggle__label">
                  Afficher les outils utilisés
                  <span class="toggle__hint">Détail des appels, masqué par défaut</span>
                </span>
                <input type="checkbox" id="show-tools" class="toggle__input" />
                <span class="toggle__switch"></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main__header">
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Afficher l'équipe" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <nav class="view-switch" role="tablist">
          <button type="button" id="tab-chat" class="view-switch__tab" role="tab" aria-selected="true">Chat</button>
          <button type="button" id="tab-calendar" class="view-switch__tab" role="tab" aria-selected="false">Calendrier</button>
          <button type="button" id="tab-history" class="view-switch__tab" role="tab" aria-selected="false">Historique</button>
        </nav>
      </header>

      <section id="chat-view" class="view chat-view--empty">
        <div id="thread" class="thread" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea
            id="message"
            class="composer__input"
            rows="1"
            placeholder="Prépare l'arrivée de Panaki le 1er septembre…"
            autofocus
          ></textarea>
          <button type="submit" class="composer__submit" id="submit" aria-label="Envoyer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true">
              <path d="M17 3 3 9.5l6 2.5m8-9-3.5 14L9 12.5m8-9.5L9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </section>

      <section id="calendar-view" class="view calendar" hidden>
        <div class="calendar__toolbar">
          <div class="calendar__nav">
            <button type="button" id="calendar-prev" class="calendar__nav-btn" aria-label="Mois précédent">‹</button>
            <h2 id="calendar-label" class="calendar__label"></h2>
            <button type="button" id="calendar-next" class="calendar__nav-btn" aria-label="Mois suivant">›</button>
          </div>
          <button type="button" id="calendar-today" class="calendar__today">Aujourd'hui</button>
        </div>
        <div id="calendar-legend" class="calendar__legend"></div>
        <div id="calendar-grid" class="calendar__grid"></div>

        <div id="calendar-day-detail" class="calendar__detail" hidden>
          <div class="calendar__detail-head">
            <h3 id="calendar-detail-title"></h3>
            <button type="button" id="calendar-detail-close" class="calendar__detail-close" aria-label="Fermer">×</button>
          </div>
          <div id="calendar-detail-list" class="calendar__detail-list"></div>
        </div>
      </section>

      <section id="history-view" class="view history" hidden>
        <div class="history__toolbar">
          <h2 class="history__title">Journal d'audit</h2>
          <button type="button" id="history-refresh" class="calendar__today">Rafraîchir</button>
        </div>
        <div id="history-list" class="history__list"></div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
